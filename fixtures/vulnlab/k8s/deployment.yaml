apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnlab
  template:
    metadata:
      labels:
        app: vulnlab
    spec:
      hostNetwork: true
      containers:
        - name: app
          image: vulnlab:latest
          securityContext:
            privileged: true
          env:
            - name: DATABASE_URL
              value: postgres://admin:supersecret@db:5432/app
